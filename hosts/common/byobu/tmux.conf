set -g mouse on
set -g allow-passthrough all
set -g set-clipboard on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# One terminal's features are colon-separated. A comma starts
# a new terminal. "xterm*:RGB,hyperlinks" drops hyperlinks.
set -as terminal-features 'xterm*:RGB:hyperlinks'
set -as terminal-features ',tmux*:RGB:hyperlinks'
set -as terminal-features ',screen*:RGB:hyperlinks'

# %p1 is the selection. Dropping it makes OSC 52 emit nothing.
set -as terminal-overrides \
  ',xterm-ghostty:Ms=\E]52;%p1%s;%p2%s\7'
set -as terminal-overrides \
  ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\7'
set -ga terminal-overrides \
  ',*:Ss=\E[%p1%d q:Se=\E[3 q:Cs=\E]12;%p1%s\a:Cr=\E]12;#39FF14\a'
